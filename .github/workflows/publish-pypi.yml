name: "Publish Releases: PyPi / GitHub"

on:
  push:
    tags:
      - '*.*.*'
    bran

# Prevent overlapping publishes if tags get pushed in quick succession.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Release, Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: pypi

    steps:
      # Checkout repository
      - name: Checkout (full history + tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Validate tag format, save as ENV
      - name: Validate tag format (x.y.z)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "This workflow only runs for tags like x.y.z. Got: $TAG"
            exit 1
          fi

      # Set-up Python 3.12 (uv)
      - name: Set up uv (Python 3.12 + cache)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      # Sync dependencies (with dev)
      - name: Sync dependencies (locked)
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --extra dev

      # Generate version specific release notes
      - name: Generate release notes (Commitizen)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          trap 'rm -f release_notes.md' EXIT

          uv run cz changelog "$TAG" --dry-run > release_notes.md

          echo "---- release_notes.md (first 40 lines) ----"
          sed -n '1,40p' release_notes.md
          echo "-------------------------------------------"

      # Generate a Release on GitHub, using generated release notes
      - name: Create GitHub Release (body from release_notes.md)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md
          rm -f release_notes.md

      # Sync without dev and build
      - name: Build (sdist + wheel)
        shell: bash
        run: |
          set -euo pipefail
          uv sync --lock
          uv build

      # Publish to PyPi
      - name: Publish to PyPI (Trusted Publishing / OIDC)
        shell: bash
        run: |
          set -euo pipefail
          uv publish
